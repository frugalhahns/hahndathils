<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<meta name="robots" content="noindex, nofollow">
<title>Hahndathils Trip · Ithaca &amp; Cortland</title>
<link rel="stylesheet" href="assets/style.css?v=359bbcb4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-box">
    <p class="kicker">Ithaca &amp; Cortland, New York</p>
    <h1>Hahndathils Trip</h1>
    <input type="password" id="gate-input" placeholder="passphrase"
           autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" required>
    <p id="gate-error" class="error" hidden>Wrong passphrase.</p>
    <button type="submit" id="gate-btn" class="btn">Unlock</button>
  </form>
</div>

<div id="site" hidden>

<header class="hero">
  <div class="wrap">
    <p class="kicker">Ithaca &amp; Cortland, New York</p>
    <h1>Hahndathils Trip</h1>
    <p id="countdown" class="countdown">…</p>
    <button id="lock" class="unlock">🔓 Lock again</button>
  </div>
</header>

<nav id="daynav" class="daynav"><div class="wrap" id="daynav-inner"></div></nav>

<main class="wrap">

  <section id="now" class="card now" hidden></section>

  <section id="itinerary" class="section">
    <h2 id="itinerary-title">Flexible itinerary</h2>
    <div id="days"></div>
    <div id="stay" hidden></div>
  </section>

  <section id="photos" class="section">
    <div class="section-head">
      <h2>Photos</h2>
      <button id="ph-add" class="btn btn-add">+ Add photos</button>
      <div id="ph-arrows" class="ph-arrows" hidden>
        <button id="ph-prev" aria-label="Previous photos">‹</button>
        <button id="ph-next" aria-label="More photos">›</button>
      </div>
    </div>
    <input type="file" id="ph-input" accept="image/*" multiple hidden>
    <p class="muted" id="ph-status" hidden></p>
    <p class="muted" id="photos-hint">Loading…</p>
    <div id="photos-body" class="gallery"></div>
  </section>

  <section id="forecast" class="section">
    <h2>Forecast</h2>
    <div class="loc-tabs" id="loc-tabs"></div>
    <div id="forecast-body"></div>
  </section>

  <section id="ideas" class="section">
    <details class="disclosure">
      <summary>
        <span class="disclosure-title">If you want to add something</span>
        <span class="disclosure-count" id="ideas-count"></span>
        <span class="disclosure-action"></span>
      </summary>
      <div class="disclosure-body">
        <div class="chips">
          <button class="chip is-on" data-filter="all">Everything</button>
          <button class="chip" data-filter="outdoor">Outdoor</button>
          <button class="chip" data-filter="indoor">Rain plan</button>
        </div>
        <div id="ideas-body" class="grid"></div>
        <div id="links-body" class="links"></div>
      </div>
    </details>
    <div id="events-leftover"></div>
  </section>

</main>

<footer class="wrap foot">
  <p id="generated" class="muted"></p>
  <p class="muted">Weather from the National Weather Service. Itinerary from the family spreadsheet.</p>
</footer>

</div><!-- /#site -->

<nav id="viewbar" class="viewbar" hidden aria-label="Section">
  <button data-view="trip" class="is-on" aria-pressed="true">Trip</button>
  <button data-view="stay" aria-pressed="false">🏠 Stay</button>
</nav>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="Close">✕</button>
  <button id="lb-prev" class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <img id="lb-img" alt="">
  <button id="lb-next" class="lb-nav lb-next" aria-label="Next photo">›</button>
  <div id="lb-count" class="lb-count"></div>
</div>

<script src="assets/app.js?v=a194a375" type="module"></script>
</body>
</html>

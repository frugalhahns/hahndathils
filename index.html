<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<meta name="robots" content="noindex, nofollow">
<title>Hahndathils · Ithaca &amp; Cortland</title>
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" id="theme-css" href="data:text/css,">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
<script>
  // Applied before first paint so switching themes does not flash the old one.
  // Temporary: delete this block, the themebar, and assets/themes/ once a
  // direction is picked, folding the winner into style.css.
  (function () {
    var THEMES = ["default", "park", "guide", "almanac"];
    var q = new URLSearchParams(location.search).get("theme");
    var t = THEMES.indexOf(q) > -1 ? q : (localStorage.getItem("theme") || "default");
    window.__setTheme = function (name) {
      localStorage.setItem("theme", name);
      // An empty href would re-request the page itself, so use a null stylesheet.
      document.getElementById("theme-css").href =
        name === "default" ? "data:text/css," : "assets/themes/" + name + ".css";
      document.querySelectorAll(".themebar button").forEach(function (b) {
        b.classList.toggle("is-on", b.dataset.theme === name);
      });
    };
    document.addEventListener("DOMContentLoaded", function () { window.__setTheme(t); });
  })();
</script>
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-box">
    <p class="kicker">Ithaca &amp; Cortland, New York</p>
    <h1>Hahndathils</h1>
    <input type="password" id="gate-input" placeholder="passphrase"
           autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" required>
    <p id="gate-error" class="error" hidden>Wrong passphrase.</p>
    <button type="submit" id="gate-btn" class="btn">Unlock</button>
  </form>
</div>

<div id="site" hidden>

<header class="hero">
  <div class="wrap">
    <p class="kicker">Ithaca &amp; Cortland, New York</p>
    <h1>Hahndathils</h1>
    <p id="countdown" class="countdown">…</p>
    <button id="lock" class="unlock">🔓 Lock again</button>
  </div>
</header>

<nav id="daynav" class="daynav"><div class="wrap" id="daynav-inner"></div></nav>

<main class="wrap">

  <section id="now" class="card now" hidden></section>

  <section id="itinerary" class="section">
    <h2>Itinerary</h2>
    <div id="days"></div>
  </section>

  <section id="forecast" class="section">
    <h2>7-day forecast</h2>
    <div class="loc-tabs" id="loc-tabs"></div>
    <div id="forecast-body"></div>
  </section>

  <section id="ideas" class="section">
    <h2>If you want to add something</h2>
    <div class="chips">
      <button class="chip is-on" data-filter="all">Everything</button>
      <button class="chip" data-filter="outdoor">Outdoor</button>
      <button class="chip" data-filter="indoor">Rain plan</button>
    </div>
    <div id="ideas-body" class="grid"></div>
    <div id="events-body"></div>
    <div id="links-body" class="links"></div>
  </section>

  <section id="photos" class="section">
    <h2>Photos</h2>
    <p class="muted" id="photos-hint">Loading…</p>
    <div id="photos-body" class="gallery"></div>
  </section>

</main>

<footer class="wrap foot">
  <p id="generated" class="muted"></p>
  <p class="muted">Weather from the National Weather Service. Itinerary from the family spreadsheet.</p>
</footer>

</div><!-- /#site -->

<!-- Temporary theme picker. Remove once a direction is chosen. -->
<div class="themebar">
  <button data-theme="default" onclick="__setTheme('default')">Current</button>
  <button data-theme="park" onclick="__setTheme('park')">Park</button>
  <button data-theme="guide" onclick="__setTheme('guide')">Guide</button>
  <button data-theme="almanac" onclick="__setTheme('almanac')">Almanac</button>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="Close">✕</button>
  <img id="lb-img" alt="">
</div>

<script src="assets/app.js" type="module"></script>
</body>
</html>
